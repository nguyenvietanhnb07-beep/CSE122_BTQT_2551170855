<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thơ Bốn Mùa</title>
    <link rel="stylesheet" href="bai1.css">
</head>
<body>
    <div class="container">
        <h1 class="tieu_de">BỐN MÙA</h1>

        <p class="kho_tho chu_xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen <br>
            Thu về lá rụng bên thềm
        </p>

        <hr class="duong_ke">

        <p class="kho_tho chu_do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr class="duong_ke">

        <p class="kho_tho chu_xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>
    </div>
    
</body>
</html>
