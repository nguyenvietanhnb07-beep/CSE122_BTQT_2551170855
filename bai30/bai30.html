<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bảng điều khiển</title>

  <!-- Bootstrap 5 CSS lấy từ CDN (cần có Internet) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <!-- d-flex: xếp sidebar và nội dung cạnh nhau; min-vh-100: cao tối thiểu bằng màn hình -->
  <div class="d-flex min-vh-100">

    <!-- ===== Sidebar ===== -->
    <!-- bg-dark: nền #212529; text-white: chữ trắng; p-2: khoảng đệm; flex-shrink-0: không bị co lại; width 230px theo đề -->
    <aside class="bg-dark text-white p-2 flex-shrink-0" style="width: 230px;">
      <!-- fw-bold: in đậm; p-2: khoảng đệm; mb-2: cách menu bên dưới -->
      <div class="fw-bold p-2 mb-2">CSE.TLU Admin</div>

      <!-- nav nav-pills flex-column: menu dọc, mục chọn có nền bo góc -->
      <nav class="nav nav-pills flex-column gap-1">
        <!-- active: mục đang chọn, nền xanh #0d6efd -->
        <a class="nav-link active" href="#">Bảng điều khiển</a>
        <!-- text-secondary: chữ xám cho các mục chưa chọn -->
        <a class="nav-link text-secondary" href="#">Bài tập</a>
        <a class="nav-link text-secondary" href="#">Sinh viên</a>
        <a class="nav-link text-secondary" href="#">Điểm số</a>
      </nav>
    </aside>

    <!-- ===== Nội dung chính ===== -->
    <!-- flex-grow-1: chiếm hết chỗ còn lại; bg-body-secondary: nền xám nhạt; p-4: khoảng đệm -->
    <main class="flex-grow-1 bg-body-secondary p-4">

      <!-- Hàng tiêu đề: tiêu đề bên trái, badge và nút bên phải -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Bảng điều khiển</h4>
        <div class="d-flex align-items-center gap-2">
          <!-- badge bg-warning text-dark: nhãn vàng, chữ tối -->
          <span class="badge bg-warning text-dark">3 bài mới</span>
          <!-- btn btn-primary btn-sm: nút xanh cỡ nhỏ -->
          <button type="button" class="btn btn-primary btn-sm">Xuất báo cáo</button>
        </div>
      </div>

      <!-- ===== 4 thẻ thống kê ===== -->
      <!-- row g-3: lưới có khoảng cách; mỗi thẻ col-md-3 = 4 thẻ cùng một hàng; col-sm-6: máy nhỏ hơn thì 2 thẻ/hàng -->
      <div class="row g-3 mb-3">

        <div class="col-sm-6 col-md-3">
          <!-- card border-0 shadow-sm: thẻ không viền, có bóng đổ -->
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <!-- small text-secondary: chữ nhỏ màu xám cho nhãn -->
              <div class="small text-secondary">Sinh viên</div>
              <!-- fs-2 fw-bold: số lớn, in đậm -->
              <div class="fs-2 fw-bold">128</div>
              <!-- progress: khung thanh tiến độ; style height 6px: thanh mảnh -->
              <div class="progress" style="height: 6px;">
                <!-- progress-bar: phần đã đạt; width = tỉ lệ %; màu mặc định xanh #0d6efd -->
                <div class="progress-bar" role="progressbar" style="width: 80%;" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="small text-secondary">Đã nộp</div>
              <div class="fs-2 fw-bold">96</div>
              <div class="progress" style="height: 6px;">
                <!-- bg-success: thanh xanh lá; 96/128 = 75% -->
                <div class="progress-bar bg-success" role="progressbar" style="width: 75%;" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="small text-secondary">Chưa nộp</div>
              <div class="fs-2 fw-bold">32</div>
              <div class="progress" style="height: 6px;">
                <!-- bg-danger: thanh đỏ #dc3545; 32/128 = 25% -->
                <div class="progress-bar bg-danger" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-sm-6 col-md-3">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="small text-secondary">Điểm TB</div>
              <div class="fs-2 fw-bold">7.8</div>
              <div class="progress" style="height: 6px;">
                <!-- bg-warning: thanh vàng #ffc107; 7.8/10 = 78% -->
                <div class="progress-bar bg-warning" role="progressbar" style="width: 78%;" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- ===== Danh sách tiến độ theo chương ===== -->
      <!-- card border-0 shadow-sm: khung thẻ không viền, có bóng đổ -->
      <div class="card border-0 shadow-sm">
        <!-- card-header bg-white fw-bold: tiêu đề nền trắng, in đậm -->
        <div class="card-header bg-white fw-bold">Tiến độ theo chương</div>

        <!-- list-group list-group-flush: danh sách dọc, bỏ viền ngoài từng mục -->
        <ul class="list-group list-group-flush">
          <!-- d-flex justify-content-between align-items-center: tên chương bên trái, badge bên phải -->
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 1 — HTML5
            <!-- badge bg-success: xanh lá cho hoàn thành 100% -->
            <span class="badge bg-success">100%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 2 — JavaScript
            <!-- badge bg-info text-dark: xanh dương nhạt, chữ tối -->
            <span class="badge bg-info text-dark">82%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 3 — CSS3
            <span class="badge bg-info text-dark">74%</span>
          </li>
          <li class="list-group-item d-flex justify-content-between align-items-center">
            Chương 4 — Bootstrap 5
            <!-- badge bg-secondary: xám cho tiến độ thấp -->
            <span class="badge bg-secondary">45%</span>
          </li>
        </ul>
      </div>

    </main>
  </div>
</body>
</html>
