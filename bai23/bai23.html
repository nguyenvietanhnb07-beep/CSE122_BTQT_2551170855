<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 23 — Thư viện ảnh hiệu ứng Hover</title>
  <!-- Liên kết file CSS -->
  <link rel="stylesheet" href="bai23.css">
</head>

<body>
  <!-- Khung chứa thư viện ảnh -->
  <main class="khung">
    <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
    <p class="mo-ta">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>

    <!-- Lưới 3 cột. Mỗi ô là 1 <figure> gồm ảnh + chú thích (figcaption) -->
    <div class="luoi">
      <figure>
        <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
        <figcaption>Vịnh Hạ Long</figcaption>
      </figure>

      <figure>
        <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">
        <figcaption>Hang Sơn Đoòng</figcaption>
      </figure>

      <figure>
        <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
        <figcaption>Thác Bản Giốc</figcaption>
      </figure>

      <figure>
        <img src="4-fansipan.jpg" alt="Fansipan">
        <figcaption>Fansipan</figcaption>
      </figure>

      <figure>
        <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
        <figcaption>Đồng bằng sông Cửu Long</figcaption>
      </figure>

      <figure>
        <img src="6-phong-nha.jpg" alt="Động Phong Nha">
        <figcaption>Động Phong Nha</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
