<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 10 - Form liên hệ</title>
  <!-- Liên kết tới file CSS riêng -->
  <link rel="stylesheet" href="bai10.css">
</head>
<body>

  <!-- Thẻ form: khung trắng bo góc, chứa toàn bộ biểu mẫu -->
  <form class="contact-form" action="#" method="post">

    <!-- Phần tiêu đề form: nền xanh, chữ trắng kèm mô tả nhỏ -->
    <div class="form-header">
      <h1>Liên hệ với chúng tôi</h1>
      <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </div>

    <!-- Phần thân form -->
    <div class="form-body">

      <!-- Lưới 2 cột: chứa 4 ô ngắn (Họ tên, Email, SĐT, Chủ đề) -->
      <div class="form-grid">

        <div class="form-group">
          <label for="hoten">Họ và tên</label>
          <input type="text" id="hoten" name="hoten" value="Nguyễn Văn An" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="an.nv@tlu.edu.vn" required>
        </div>

        <div class="form-group">
          <label for="sdt">Số điện thoại</label>
          <input type="tel" id="sdt" name="sdt" value="0987 654 321">
        </div>

        <div class="form-group">
          <label for="chude">Chủ đề</label>
          <select id="chude" name="chude">
            <option value="khoahoc" selected>Hỏi về khoá học</option>
            <option value="hocphi">Học phí</option>
            <option value="kythuat">Hỗ trợ kỹ thuật</option>
            <option value="khac">Khác</option>
          </select>
        </div>

      </div>

 
      <div class="form-group">
        <label for="noidung">Nội dung</label>

        <textarea id="noidung" name="noidung" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
      </div>

      <div class="form-check">
        <input type="checkbox" id="dongy" name="dongy" checked>
        <label for="dongy">Tôi đồng ý nhận email phản hồi.</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Gửi liên hệ</button>
        <button type="reset" class="btn btn-secondary">Nhập lại</button>
      </div>

    </div>
  </form>

</body>
</html>
